name: Weekly web app rebuild

on:
  schedule:
    # Thursdays 13:00 UTC = 8am EST (9am EDT before early November). Cron here
    # is always UTC, so it shifts an hour against Eastern time across DST.
    - cron: "0 13 * * 4"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to push the rebuilt files back to main

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # nfl_data_py 0.3.3 declares pandas<2, which conflicts with pandas>=2 in
      # requirements.txt, so pip can't resolve them together. Install it
      # without its declared deps (as the local env effectively does) and pull
      # in its remaining runtime deps by hand. numpy<2 matches the local env.
      - name: Install dependencies
        run: |
          grep -v '^nfl_data_py' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt "numpy<2" appdirs fastparquet
          pip install --no-deps "nfl_data_py>=0.3.3"

      # Only the --no-logos build is tracked in git (see .gitignore).
      - name: Generate web app
        run: python -m nfl_margin_model.frontend.generate --no-logos

      - name: Commit and push if changed
        run: |
          git add nfl_margin_model/frontend/index_no_logos.html \
                  nfl_margin_model/frontend/preds_no_logos.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild the web app ($(date -u +%Y-%m-%d))"
          git push
